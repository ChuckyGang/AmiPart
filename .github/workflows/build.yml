name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate icon
        run: |
          pip install pillow -q
          make icon

      # Bebbo-built binaries hang on launch on real Amiga / FS-UAE
      # (libnix collides with the user-declared library-base globals
      # in src/main.c). Bartman's m68k-amiga-elf-gcc + elf2hunk path
      # works.  We fetch the toolchain from Bartman's amiga-debug
      # VS Code extension, which bundles a Linux build of GCC and
      # elf2hunk under bin/linux/.
      - name: Cache Bartman toolchain
        id: bartman-cache
        uses: actions/cache@v4
        with:
          path: bartman
          key: bartman-amiga-debug-1.8.2

      - name: Fetch Bartman toolchain
        if: steps.bartman-cache.outputs.cache-hit != 'true'
        env:
          BARTMAN_VERSION: 1.8.2
        run: |
          curl -fsSL -o bartman.vsix \
            "https://bartmanabyss.gallery.vsassets.io/_apis/public/gallery/publisher/bartmanabyss/extension/amiga-debug/${BARTMAN_VERSION}/assetbyname/Microsoft.VisualStudio.Services.VSIXPackage"
          unzip -q bartman.vsix -d bartman
          rm bartman.vsix

      - name: Build with Bartman toolchain
        run: |
          BARTMAN="$PWD/bartman/extension/bin/linux"
          # .vsix stores binaries as 0666; restore +x on every toolchain
          # executable, including the target-internal cross-as that
          # gcc invokes from opt/m68k-amiga-elf/bin/.
          chmod +x "$BARTMAN/elf2hunk"
          find "$BARTMAN/opt/bin" \
               "$BARTMAN/opt/libexec" \
               "$BARTMAN/opt/m68k-amiga-elf/bin" \
               -type f -exec chmod +x {} +
          make TOOLCHAIN=bartman BARTMAN="$BARTMAN"

      - name: Build autoboot ADF
        run: |
          BARTMAN="$PWD/bartman/extension/bin/linux"
          pip install amitools -q
          make adf TOOLCHAIN=bartman BARTMAN="$BARTMAN"

      - name: Upload binary + icon
        uses: actions/upload-artifact@v4
        with:
          name: AmiPart
          path: |
            out/AmiPart
            out/AmiPart.info
            out/AmiPart.adf
          if-no-files-found: error

  build-linux:
    runs-on: ubuntu-latest
    needs: build            # the differential test below needs the m68k binary

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build native Linux CLI
        run: make linux

      - name: Download m68k binary (for the differential test)
        uses: actions/download-artifact@v4
        with:
          name: AmiPart
          path: out

      - name: Smoke test (image round-trip)
        run: |
          cd host
          dd if=/dev/zero of=ci.hdf bs=1M count=8 status=none
          cat > ci.script <<'EOF'
          OPEN FILE ci.hdf
          INIT NEW
          ADDPART NAME=DH0 LOW=2 HIGH=8 TYPE=DOS3 BOOTABLE
          ADDPART NAME=DH1 LOW=9 HIGH=15 TYPE=PDS3
          WRITE
          BACKUPEXT FILE=ci.erdb
          VERIFYEXT FILE=ci.erdb
          CLOSE
          EOF
          ./amipart SCRIPT ci.script FORCE
          ./amipart IMAGE=ci.hdf INFO
          ./amipart IMAGE=ci.hdf CHECK

      - name: Endian regression harness
        run: |
          ./test/host/build.sh
          cd host
          dd if=/dev/zero of=rt.hdf bs=1M count=8 status=none
          ../test/host/hostrdb ci.hdf rt.hdf
          cmp ci.hdf rt.hdf && echo "round-trip byte-identical"

      - name: Native fuzz (grow/shrink matrix, FFS/SFS/PFS3)
        run: |
          pip install amitools -q
          cd test && AMIPART_HOST=1 python3 testloop.py 6 20260828

      # Same GROW/SHRINK on the same images with the m68k binary (vamos) and
      # the native binary: the results must be byte-identical.  Catches any
      # native-endian access to on-disk structures that the per-filesystem
      # checks cannot see (this is how the SFS bitmap and free-count bugs
      # were found).
      - name: Differential test m68k vs native
        run: |
          cd test && python3 difftest.py 20260912

      # Internal FFS formatter: byte-identical to xdftool for DOS\0..DOS\7
      # (timestamps masked), readable by xdftool, and identical between the
      # m68k and the native binary.
      - name: Internal formatter test
        run: |
          cd test && python3 fmttest.py

      - name: Raw device backend test (loop device)
        run: |
          cd host
          dd if=/dev/zero of=loop.img bs=1M count=8 status=none
          dd if=/dev/zero of=ref.img  bs=1M count=8 status=none
          LOOP=$(sudo losetup --find --show loop.img)
          sudo ./amipart DEV=$LOOP INIT NEW FORCE
          sudo ./amipart DEV=$LOOP ADDPART NAME=DH0 LOW=2 HIGH=8 TYPE=DOS3 BOOTABLE FORCE
          sudo ./amipart DEV=$LOOP INFO
          sudo ./amipart LISTDEV UNITS | tee lsdev.out
          grep -F "$LOOP" lsdev.out
          grep -F "RDB @ block" lsdev.out | grep -F "DH0"
          sudo losetup -d "$LOOP"
          ./amipart IMAGE=ref.img INIT NEW FORCE
          ./amipart IMAGE=ref.img ADDPART NAME=DH0 LOW=2 HIGH=8 TYPE=DOS3 BOOTABLE FORCE
          cmp loop.img ref.img
          echo "raw-device RDB byte-identical to image mode"

      - name: Upload Linux binary
        uses: actions/upload-artifact@v4
        with:
          name: amipart-linux-x86_64
          path: host/amipart
          if-no-files-found: error

  release:
    needs: [build, build-linux]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download built binary
        uses: actions/download-artifact@v4
        with:
          name: AmiPart
          path: out

      - name: Download Linux binary
        uses: actions/download-artifact@v4
        with:
          name: amipart-linux-x86_64
          path: linux-out

      - name: Set release date
        id: date
        run: echo "DATE=$(date -u +%Y%m%d)" >> "$GITHUB_OUTPUT"

      - name: Create LHA archive
        run: |
          ARCHIVE="AmiPart-${{ steps.date.outputs.DATE }}-PROTO.lha"
          python3 support/make_lha.py "$ARCHIVE" \
            "AmiPart:out/AmiPart" \
            "AmiPart.info:out/AmiPart.info" \
            "README.md:README.md" \
            "Catalogs/AmiPart.cd:catalogs/AmiPart.cd" \
            "Catalogs/README.txt:catalogs/README.txt" \
            "support/gencat.py:support/gencat.py"
          ls -lh "$ARCHIVE"

      - name: Delete previous PROTO release (if any)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete proto --yes 2>/dev/null || true
          git push --delete origin proto 2>/dev/null || true

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create proto \
            --title "AmiPart ${{ steps.date.outputs.DATE }} PROTO" \
            --notes "Automated prototype build from commit \`${{ github.sha }}\`." \
            --prerelease \
            "AmiPart-${{ steps.date.outputs.DATE }}-PROTO.lha" \
            "out/AmiPart.adf#AmiPart-autoboot.adf" \
            "linux-out/amipart#amipart-linux-x86_64"

      # Keep every build reachable: the rolling "proto" release above is
      # replaced on each push, so a dated copy stays behind for users who
      # need to go back to an earlier build (issue #12).
      - name: Keep a dated copy of this build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="proto-${{ steps.date.outputs.DATE }}-${GITHUB_SHA::7}"
          gh release create "$TAG" \
            --title "AmiPart ${{ steps.date.outputs.DATE }} (${GITHUB_SHA::7})" \
            --notes "Archived prototype build from commit \`${{ github.sha }}\`. The rolling \`proto\` release always has the newest build." \
            --prerelease \
            "AmiPart-${{ steps.date.outputs.DATE }}-PROTO.lha" \
            "out/AmiPart.adf#AmiPart-autoboot.adf" \
            "linux-out/amipart#amipart-linux-x86_64"
